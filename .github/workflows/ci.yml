name: MEDISENTINEL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sih project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sih project/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sih project/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app/api/federated.py app/services/federated.py app/services/differential_privacy.py app/services/risk_engine.py
