<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2322c55e'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDISENTINEL | YOUR HEALTH, OUR WATCH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <!-- Mobile-safe emergency exit for the drill-down modal. This is intentionally
         framework-independent so the user can always leave the modal even if a
         React event handler is blocked by a browser/WebView event issue. -->
    <script>
      (function () {
        function isDrillDownExit(target) {
          var el = target && target.closest ? target.closest('button') : null;
          if (!el) return false;
          var label = (el.getAttribute('aria-label') || '').toLowerCase();
          var text = (el.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
          return label === 'return to surveillance overview' ||
            label === 'close drill-down analysis' ||
            text.indexOf('return to overview') !== -1 ||
            text.indexOf('return to surveillance map') !== -1;
        }

        function exitDrillDown(event) {
          if (!isDrillDownExit(event.target)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          // A normal document navigation guarantees that the React modal state
          // is reset, even when the component's click handler cannot fire.
          window.location.replace(window.location.href.split('#')[0]);
        }

        document.addEventListener('click', exitDrillDown, true);
        document.addEventListener('pointerup', exitDrillDown, true);
        document.addEventListener('touchend', exitDrillDown, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
